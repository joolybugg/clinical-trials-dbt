# Copy to ~/.dbt/profiles.yml. Credentials come from environment variables
# (see .env.example) so nothing secret is committed.
clinical_trials:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      authenticator: snowflake_jwt
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'TRANSFORMER') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'CTGOV_WH') }}"
      database: CTGOV_ANALYTICS
      schema: dev
      threads: 4
